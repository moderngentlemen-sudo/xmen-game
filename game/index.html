<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel Strike Team Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow:wght@400;500;600&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* A comic book: ink borders, yellow caption boxes, halftone paper behind the menus. The game view (the stage) sits
   between two HUD bands, so no HUD element ever covers the play area; only menus, on a paused game, go over it. */
:root {
  --ink: #120d1a; --paper: #fff8e7; --caption: #ffd23f; --text: #f7f3ff; --muted: #b9b0cf; --plate: rgba(18, 13, 26, 0.86);
  --hostile: #ff2e7e; --gold: #ffd23f; --font-comic: 'Bangers', 'Impact', 'Arial Black', sans-serif;
  --font-display: 'Saira Condensed', 'Arial Narrow', sans-serif; --font-body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: #1d1648; color: var(--text); font-family: var(--font-body); overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1d1648; display: flex; flex-direction: column; }
#stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
#game, #ink { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.band { position: relative; flex: none; overflow: hidden; pointer-events: none; font-size: 15px;
  background: radial-gradient(circle, rgba(255,248,231,0.07) 1px, transparent 1.4px) 0 0 / 6px 6px, var(--ink); }
#hud-top { height: 54px; border-bottom: 3px solid #000; }
#hud-bottom { height: 108px; border-top: 3px solid #000; }
.band > .row { position: absolute; inset: 0; }
#hud-top > .row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 0 10px 3px; }
#hud-top .left { display: flex; align-items: center; min-width: 0; }
#hud-top .right { display: flex; justify-content: flex-end; align-items: center; min-width: 0; }
/* The Sentinels' alert, else a first-time hint, takes the mission caption's place */
#hud-top .adapt:not([hidden]) ~ .tip, #hud-top .adapt:not([hidden]) ~ .mission, #hud-top .tip:not([hidden]) ~ .mission { display: none; }
.tip { box-sizing: border-box; min-width: 0; max-width: 100%; background: #fff; color: var(--ink); border: 3px solid var(--ink); box-shadow: 3px 3px 0 #000; padding: 3px 8px;
  font-family: var(--font-display); font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: tipIn 0.25s ease-out; }
.tip b { font-family: var(--font-comic); font-weight: 400; color: var(--ink); margin-right: 4px; }
.tip kbd { font-size: 12px; padding: 0 4px; }
@keyframes tipIn { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
#game { outline: none; }
#ink { pointer-events: none; }
#ui { position: absolute; inset: 0; pointer-events: none; font-size: 15px; }
kbd { font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 0 6px; border-radius: 3px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); }

/* Menus: a comic page over a halftone wash */
.screen { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; pointer-events: auto; overflow: auto;
  background: radial-gradient(circle, rgba(18,13,26,0.55) 1.2px, transparent 1.6px) 0 0 / 7px 7px, linear-gradient(160deg, rgba(29,22,72,0.85), rgba(122,63,143,0.7)); }
.page { width: 100%; max-width: 900px; max-height: calc(100vh - 40px); overflow: auto; background: var(--paper); color: var(--ink); border: 5px solid var(--ink);
  box-shadow: 10px 10px 0 var(--ink); padding: 22px 26px; transform: rotate(-0.4deg); }
.page h1 { font-family: var(--font-comic); font-weight: 400; font-size: clamp(44px, 8vw, 92px); line-height: 0.9; margin: 0; letter-spacing: 0.02em;
  color: var(--caption); -webkit-text-stroke: 3px var(--ink); text-shadow: 5px 5px 0 var(--ink); transform: rotate(-2deg); transform-origin: left; }
.page h1 small { display: block; font-size: 0.42em; color: #ff3a24; margin-top: 6px; }
.page h2 { font-family: var(--font-comic); font-weight: 400; font-size: 38px; margin: 0 0 8px; letter-spacing: 0.03em; }
.page h3 { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; font-size: 15px; margin: 0 0 6px; }
.caption { display: inline-block; background: var(--caption); border: 3px solid var(--ink); padding: 4px 10px; font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
.lede { margin: 14px 0; font-size: 16px; line-height: 1.45; max-width: 70ch; }
.join { font-family: var(--font-comic); font-size: 30px; letter-spacing: 0.04em; margin: 8px 0 16px; animation: pulse 1.1s ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.04); } }
.roster { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 10px 0 16px; }
.hero { border: 3px solid var(--ink); padding: 10px 12px; background: #fff; box-shadow: 4px 4px 0 var(--ink); }
.hero b { display: block; font-family: var(--font-comic); font-size: 28px; letter-spacing: 0.03em; color: var(--hc); -webkit-text-stroke: 1px var(--ink); }
.hero span { display: block; font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; font-size: 13px; }
.hero p { margin: 6px 0 0; font-size: 14px; line-height: 1.4; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 2px solid rgba(18,13,26,0.15); }
th { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; }
.fine { font-size: 12.5px; line-height: 1.5; margin: 14px 0 0; color: #3a3346; }
.touchnote { display: none; font-weight: 600; color: #b3261e; }
@media (pointer: coarse) and (hover: none) { .touchnote { display: block; } }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 6px; }
.btn { font-family: var(--font-comic); font-size: 22px; letter-spacing: 0.04em; color: var(--ink); background: var(--caption); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  padding: 6px 16px; cursor: pointer; pointer-events: auto; }
.btn:hover, .btn.sel { background: #fff; }
.btn:focus-visible { outline: 3px solid #ff3a24; outline-offset: 3px; }
.btn.small { font-size: 17px; padding: 3px 10px; box-shadow: 3px 3px 0 var(--ink); }
.btn.key { min-width: 90px; font-family: var(--font-display); font-weight: 800; font-size: 15px; }
.btn.key.unbound { background: #ffd6cf; } .btn.key.listening { background: #ff3a24; color: #fff; }
/* The ready room: a card per player */
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 12px 0; }
.slot { border: 3px solid var(--ink); background: #fff; box-shadow: 4px 4px 0 var(--ink); padding: 8px 10px; border-top: 8px solid var(--pc, #999); display: flex; flex-direction: column; gap: 6px; }
.slot .who { display: flex; align-items: baseline; gap: 8px; } .slot .who b { font-family: var(--font-comic); font-size: 26px; color: var(--pc); -webkit-text-stroke: 1px var(--ink); }
.slot .who span { font-family: var(--font-display); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; }
.slot .pick { display: flex; align-items: center; gap: 6px; } .slot .btn.arrow { font-size: 18px; padding: 2px 8px; box-shadow: 2px 2px 0 var(--ink); }
.slot .hn { flex: 1; text-align: center; } .slot .hn b { display: block; font-family: var(--font-comic); font-size: 26px; color: var(--hc); -webkit-text-stroke: 1px var(--ink); }
.slot .hn span { font-family: var(--font-display); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; }
.slot .keys { margin: 0; font-size: 12.5px; line-height: 1.5; } .slot .btn.small { align-self: flex-start; }
.slot.open { border-style: dashed; border-top-width: 3px; background: rgba(255,255,255,0.5); box-shadow: none; justify-content: center; align-items: center; text-align: center; min-height: 120px; }
.slot.open b { font-family: var(--font-comic); font-size: 24px; color: #8a8096; } .slot.open span { font-size: 13px; color: #5a5068; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 8px 16px; margin: 8px 0; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 8px; border: 2px solid rgba(18,13,26,0.2); }
.setting input[type=range] { width: 45%; accent-color: #ff3a24; }
.setting input[type=checkbox] { width: 18px; height: 18px; accent-color: #ff3a24; }
.setting select { font: inherit; }

/* The HUD: caption boxes */
.plates { position: absolute; left: 8px; right: 8px; top: 8px; bottom: 6px; display: flex; gap: 10px; justify-content: center; align-items: flex-start; flex-wrap: nowrap; }
.plate { width: min(250px, 24%); min-width: 0; overflow: hidden; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: 3px 3px 0 #000; padding: 2px 8px 4px; transform: rotate(-0.5deg); }
.plate:nth-child(even) { transform: rotate(0.5deg); }
.plate .top { display: flex; align-items: baseline; gap: 6px; line-height: 1.05; white-space: nowrap; overflow: hidden; }
.plate .tag { font-family: var(--font-comic); font-size: 18px; color: var(--pc); -webkit-text-stroke: 1px var(--ink); }
.plate .name { font-family: var(--font-comic); font-size: 20px; letter-spacing: 0.03em; }
.plate .combo { min-width: 0; overflow: hidden; margin-left: auto; font-family: var(--font-comic); font-size: 15px; letter-spacing: 0.03em; color: var(--ink); white-space: nowrap; }
.plate .combo em { font-style: normal; display: inline-block; min-width: 1.1em; text-align: center; padding: 0 3px; margin-left: 2px; background: var(--ink); color: #fff; transform: skewX(-8deg); }
.plate .combo em.rank3 { color: #ffd23f; } .plate .combo em.rank4 { color: #ff8a1f; } .plate .combo em.rank5 { background: #ff3a24; color: #fff1b8; }
.plate .pips { display: flex; gap: 2px; margin-left: 6px; align-self: center; flex: none; }
.plate .pips i { width: 12px; height: 8px; border: 2px solid var(--ink); background: linear-gradient(90deg, #b06cff calc(var(--f, 0) * 100%), #e9e1cf 0); }
.plate .pips i.full { background: #b06cff; box-shadow: 0 0 4px #b06cff; }
.plate .role { min-width: 0; margin-left: auto; font-family: var(--font-display); font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: #5a5068; overflow: hidden; text-overflow: ellipsis; }
.meter { position: relative; height: 9px; margin: 2px 0; border: 2px solid var(--ink); background: #e9e1cf; overflow: hidden; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; }
.meter.hp i { background: #39c46a; } .meter.hp.low i { background: #ff3a24; }
.meter.res { height: 10px; } .meter.res i { background: var(--rc); }
.meter.res b { position: absolute; right: 3px; top: 0; font-family: var(--font-display); font-weight: 800; font-size: 9px; line-height: 6px; text-transform: uppercase; }
.foot { display: flex; gap: 6px; align-items: center; margin-top: 3px; min-height: 17px; }
.chips { display: flex; flex-wrap: nowrap; gap: 3px; overflow: hidden; flex: 1 1 auto; min-width: 0; }
.chip { font-family: var(--font-display); font-weight: 800; font-size: 10.5px; line-height: 13px; text-transform: uppercase; letter-spacing: 0.05em; padding: 0 4px; border: 2px solid var(--ink); background: #fff; white-space: nowrap; }
.chip.on { background: var(--caption); } .chip.hot { background: #ff3a24; color: #fff; } .chip.off { opacity: 0.45; }
.bench { display: flex; gap: 3px; flex: none; }
.bench span { font-family: var(--font-display); font-weight: 800; font-size: 10px; line-height: 13px; text-transform: uppercase; padding: 0 4px 1px; border: 2px solid var(--ink); background: #fff; position: relative; overflow: hidden; }
.bench span i { position: absolute; left: 0; bottom: 0; height: 3px; background: #39c46a; }
.bench span.cur { background: var(--caption); } .bench span.down { opacity: 0.4; text-decoration: line-through; }
.topbar { display: flex; align-items: center; }
.gauge { width: min(380px, 38vw); background: var(--paper); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 3px 8px 5px; color: var(--ink); }
.gauge .lbl { display: flex; justify-content: space-between; font-family: var(--font-comic); font-size: 17px; letter-spacing: 0.04em; }
.gauge .meter i { background: linear-gradient(90deg, #ffd23f, #fff1b8); }
.gauge.full .meter i { animation: gaugeGlow 0.5s ease-in-out infinite alternate; }
@keyframes gaugeGlow { from { background: #ffd23f; } to { background: #ff3a24; } }
.kidplate { flex: none; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 3px 8px 5px; width: 150px; }
.kidplate b { font-family: var(--font-comic); font-size: 17px; letter-spacing: 0.04em; } .kidplate span { float: right; font-family: var(--font-display); font-weight: 800; font-size: 12px; text-transform: uppercase; }
.kidplate.alarm { background: #ff3a24; color: #fff; }
.mission { box-sizing: border-box; min-width: 0; background: var(--caption); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 3px 9px; font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; font-size: 13px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adapt { box-sizing: border-box; min-width: 0; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--hostile); color: #fff; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 1px 8px; font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; font-size: 12px; line-height: 1.2; text-align: center; }
.adapt small { display: block; font-weight: 600; text-transform: none; letter-spacing: 0; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 14px; background: var(--caption); pointer-events: none; animation: bannerIn 0.3s cubic-bezier(0.2, 1.5, 0.4, 1); }
.banner strong { font-family: var(--font-comic); font-weight: 400; font-size: 38px; line-height: 1; letter-spacing: 0.03em; color: #fff; -webkit-text-stroke: 2px var(--ink); text-shadow: 3px 3px 0 var(--ink); white-space: nowrap; }
.banner span { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); padding: 2px 10px; font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
.banner.bad { background: #ff3a24; }
@keyframes bannerIn { from { transform: scaleY(0.2); opacity: 0; } to { transform: none; opacity: 1; } }
.letterbox { position: absolute; inset: 0; background: var(--ink); transform: scaleY(0); transition: transform 0.2s; pointer-events: none; }
.letterbox.on { transform: none; }
@media (max-width: 760px) { .plate { min-width: 150px; } .mission { display: none; } }
@media (prefers-reduced-motion: reduce) { .join, .banner, .gauge.full .meter i { animation: none; } }
</style>
</head>
<body>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<div id="app">
  <div id="hud-top" class="band"></div>
  <div id="stage">
    <canvas id="game" tabindex="0" aria-label="X-Men: Sentinel Strike, Team Edition game view"></canvas>
    <canvas id="ink" aria-hidden="true"></canvas>
  </div>
  <div id="hud-bottom" class="band"></div>
  <div id="ui"></div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
